name: AniList Incremental Backup

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Prevent overlapping runs from causing git push conflicts
concurrency:
  group: anilist-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run incremental sync
        run: python sync.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ state.json
          if git diff --staged --quiet; then
            echo "No new updates to commit."
            exit 0
          fi
          git commit -m "chore(sync): incremental update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push origin main
