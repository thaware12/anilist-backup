name: AniList Incremental Backup

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: anilist-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Continuous Sync Loop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          START_TIME=$(date +%s)
          MAX_DURATION=3000
          
          while true; do
            NOW=$(date +%s)
            if [ $((NOW - START_TIME)) -ge$MAX_DURATION ]; then
              break
            fi
            
            python sync.py
            
            git add -A data/ state.json || true
            if ! git diff --staged --quiet; then
              git commit -m "chore(sync): automated data update"
              git pull --rebase origin main
              git push origin main
            fi
            
            SEED_DONE=$(python -c "import json; print(json.load(open('state.json')).get('seed_complete', False))")
            if [ "$SEED_DONE" = "True" ]; then
              sleep 300
            else
              sleep 5
            fi
          done
